name: Kali Linux VNC TCP via Tailscale

on:
  workflow_dispatch:

jobs:
  kali-vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 ساعات

    steps:
      - name: Start Kali Container
        run: |
          docker run -d --name kali \
            -p 5901:5901 \
            kalilinux/kali-rolling sleep infinity

      - name: Install Desktop + VNC
        run: |
          docker exec kali apt update
          docker exec kali apt install -y \
            kali-desktop-xfce \
            tigervnc-standalone-server \
            dbus-x11 wget curl

      - name: Configure VNC
        run: |
          docker exec kali bash -c "
          mkdir -p /root/.vnc
          echo '123456' | vncpasswd -f > /root/.vnc/passwd
          chmod 600 /root/.vnc/passwd
          echo '#!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4 &' > /root/.vnc/xstartup
          chmod +x /root/.vnc/xstartup
          "

      - name: Start VNC Server
  run: |
    docker exec -d kali sh -c "vncserver :1 -geometry 1280x720 -localhost no -interface 0.0.0.0"
    
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname=kali-gha --accept-dns=false

      - name: Show Tailscale IP
        run: tailscale ip -4

      - name: Keep job alive
        run: sleep 14400
