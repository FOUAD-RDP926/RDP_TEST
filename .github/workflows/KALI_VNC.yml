name: Kali Linux VNC TCP (playit.gg)

on:
  workflow_dispatch:

jobs:
  kali-vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 4 ساعات

    steps:
      - name: Start Kali Container
        run: |
          docker run -d --name kali \
            -p 5901:5901 \
            kalilinux/kali-rolling sleep infinity

      - name: Install Desktop + VNC
        run: |
          docker exec kali apt update
          docker exec kali apt install -y \
            kali-desktop-xfce \
            tigervnc-standalone-server \
            dbus-x11 wget

      - name: Configure VNC
        run: |
          docker exec kali bash -c "
          mkdir -p /root/.vnc
          echo '123456' | vncpasswd -f > /root/.vnc/passwd
          chmod 600 /root/.vnc/passwd
          echo '#!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4 &' > /root/.vnc/xstartup
          chmod +x /root/.vnc/xstartup
          "

      - name: Start VNC Server
        run: |
          docker exec -d kali sh -c "vncserver :1 -geometry 1280x720 -localhost no"

      - name: Install playit agent
        run: |
          wget https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit-linux-amd64

      - name: Start playit.gg TCP tunnel
        env:
          PLAYIT_AUTH_KEY: ${{ secrets.PLAYIT_AUTH_KEY }}
        run: |
          ./playit-linux-amd64 auth set $PLAYIT_AUTH_KEY
          ./playit-linux-amd64 &

      - name: Keep job alive (4 hours)
        run: sleep 14400
